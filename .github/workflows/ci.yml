name: Verify

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, Actualizacion]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      # Render conserva este comando histórico y compila sólo main.go.
      - run: go build -o "$RUNNER_TEMP/pricepulse-server" main.go
      - run: go vet ./...
      - run: go test ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui

  discord-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: discord-worker
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: discord-worker/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  deploy-discord-worker:
    needs: [backend, frontend, discord-worker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: discord-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
      DISCORD_APPLICATION_ID: ${{ vars.DISCORD_APPLICATION_ID }}
      BACKEND_URL: ${{ vars.BACKEND_URL }}
      FRONTEND_URL: ${{ vars.FRONTEND_URL }}
      DISCORD_PUBLIC_KEY: ${{ vars.DISCORD_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v5
      - id: preflight
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$DISCORD_TOKEN" ] && [ -n "$DISCORD_APPLICATION_ID" ] && [ -n "$BACKEND_URL" ] && [ -n "$FRONTEND_URL" ] && [ -n "$DISCORD_PUBLIC_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Discord Worker no se desplegó: faltan secretos o variables de configuración."
          fi
      - uses: actions/setup-node@v7
        if: steps.preflight.outputs.configured == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: discord-worker/package-lock.json
      - if: steps.preflight.outputs.configured == 'true'
        run: npm ci
      - if: steps.preflight.outputs.configured == 'true'
        run: npx wrangler deploy --var "BACKEND_URL:$BACKEND_URL" --var "FRONTEND_URL:$FRONTEND_URL" --var "DISCORD_APPLICATION_ID:$DISCORD_APPLICATION_ID" --var "DISCORD_PUBLIC_KEY:$DISCORD_PUBLIC_KEY"
      - if: steps.preflight.outputs.configured == 'true' && env.DISCORD_TOKEN != '' && env.DISCORD_APPLICATION_ID != ''
        run: npm run register-command
